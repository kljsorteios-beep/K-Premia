<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Minha Conta | Kóòpremios</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #d4af37; --bg: #081021; --card: #111b33; --text: #e1e1e6; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .profile-card, .orders-card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h2 { color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
        .info-row { margin: 10px 0; }
        .btn-logout { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
        .cota-badge { display: inline-block; background: var(--primary); color: var(--bg); padding: 5px 10px; border-radius: 4px; font-weight: bold; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-card">
            <h2>Dados do Perfil</h2>
            <div class="info-row"><strong>E-mail:</strong> <span id="userEmail">Carregando...</span></div>
            <button class="btn-logout" onclick="logout()">Sair</button>
        </div>

        <div class="orders-card">
            <h2>Meus Títulos (Cotas)</h2>
            <div id="listaCotas">
                <p>Você ainda não possui cotas compradas.</p>
                <!-- Aqui entra a listagem via JavaScript no futuro -->
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = { /* Cole sua configuração aqui novamente */ };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('userEmail').innerText = user.email;
            } else {
                window.location.href = "login.html";
            }
        });

        window.logout = () => signOut(auth).then(() => window.location.href = "index.html");
    </script>
</body>
</html>
